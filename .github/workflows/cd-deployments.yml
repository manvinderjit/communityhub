name: Cloudflare Worker Deployments

env:
  # Set the target environment variable for use in steps
  TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

on:
  push:
    branches:
      - chore/deployment # For testing only, remove before merging with dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  deploy:
    # 1. Map the branch name to a GitHub Environment
    # environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    env:
      NODE_VERSION: 20
      CLOUDFLARE_API_TOKEN: ${{ secrets.TJS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TJS_CLOUDFLARE_ACCOUNT_ID }}
      DEV_COMM_HUB_D1_DB_NAME: ${{ vars.DEV_COMM_HUB_D1_DB_NAME }}
      # DEV_COMM_HUB_D1_BINDING_SECRET: ${{ secrets.DEV_COMM_HUB_D1_BINDING_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Manage D1 Database (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: |
          echo "Attempting to delete Dev database"
          npx wrangler d1 delete ${{ env.DEV_COMM_HUB_D1_DB_NAME }} -y || true > /dev/null

      - name: Create New Dev D1 Instance (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 create ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --env dev > /dev/null

      - name: Inject DEV D1 and KV IDs via SED Set Environment Variable in Wrangler TOML
        if: ${{ env.TARGET_ENV == 'dev' }}
        env:
          # Ensure you are loading your KV IDs from GitHub Secrets into these env vars
          DEV_SESSION_ID: ${{ secrets.DEV_COMM_HUB_SESSION_TOKENS_ID }}
          DEV_ACTIVATION_ID: ${{ secrets.DEV_COMM_HUB_ACTIVATION_TOKENS_ID }}
          DEV_PASSWORD_ID: ${{ secrets.DEV_COMM_HUB_PASSWORD_RESET_TOKENS_ID }}
          DEV_SENDER_EMAIL: ${{ secrets.DEV_COMM_HUB_SENDER_EMAIL }}
        run: |
          DB_ID=$(npx wrangler d1 info ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --json | jq -r '.uuid')
          echo "DEV_COMM_HUB_D1_DB_ID=$DB_ID" >> $GITHUB_ENV

          sed -i "s#database_name = \"\${DEV_COMM_HUB_D1_DB_NAME}\"#database_name = \"$DEV_COMM_HUB_D1_DB_NAME\"#g" wrangler.toml
          sed -i "s#database_id = \"\${DEV_COMM_HUB_D1_DB_ID}\"#database_id = \"$DB_ID\"#g" wrangler.toml

          # SessionTokens: Replace placeholder with actual ID
          sed -i "s#id = \"\${DEV_COMM_HUB_SESSION_TOKENS}\"#id = \"$DEV_SESSION_ID\"#g" wrangler.toml

          # ActivationTokens: Replace placeholder with actual ID
          sed -i "s#id = \"\${DEV_COMM_HUB_ACTIVATION_TOKENS}\"#id = \"$DEV_ACTIVATION_ID\"#g" wrangler.toml

          # PasswordResetToken: Replace placeholder with actual ID
          sed -i "s#id = \"\${DEV_COMM_HUB_PASSWORD_RESET_TOKENS}\"#id = \"$DEV_PASSWORD_ID\"#g" wrangler.toml

          sed -i "s#SENDER_EMAIL = \"\${DEV_COMM_HUB_SENDER_EMAIL}\"#SENDER_EMAIL = \"$DEV_SENDER_EMAIL\"#g" wrangler.toml

      # - name: Print Final wrangler.toml for Debugging
      #   run: |
      #     echo "--- Contents of wrangler.toml ---"
      #     cat wrangler.toml
      #     echo "---------------------------------"

      - name: Apply D1 Migrations to DEV D1 Database
        env:
          DEV_COMM_HUB_D1_DB_ID: ${{ env.DEV_COMM_HUB_D1_DB_ID }}
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 migrations apply Database --env dev --remote

      - name: Seed Data to DEV D1 Database
        env:
          DEV_COMM_HUB_D1_DB_ID: ${{ env.DEV_COMM_HUB_D1_DB_ID }}
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 execute Database --env dev --remote --file=./db/seeds/seed-data.sql

      - name: Inject Resend API Key Secret
        run: |
          # Use the secret from GitHub, piping it directly to the command
          # to prevent it from being stored in shell history or logs.
          echo "${{ secrets.DEV_COMM_HUB_RESEND_API_KEY }}" | npx wrangler secret put RESEND_API_KEY --env dev > /dev/null

      - name: Deploy application to Dev Worker
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler deploy --minify --env dev
