name: Cloudflare Worker Deployments

env:
  # Set the target environment variable for use in steps
  TARGET_ENV: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

on:
  push:
    branches:
      - chore/deployment # For testing only, remove before merging with dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  deploy:
    # 1. Map the branch name to a GitHub Environment
    # environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    env:
      NODE_VERSION: 20
      CLOUDFLARE_API_TOKEN: ${{ secrets.TJS_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TJS_CLOUDFLARE_ACCOUNT_ID }}
      DEV_COMM_HUB_D1_DB_NAME: ${{ vars.DEV_COMM_HUB_D1_DB_NAME }}
      # DEV_COMM_HUB_D1_BINDING_SECRET: ${{ secrets.DEV_COMM_HUB_D1_BINDING_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Manage D1 Database (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: |
          echo "Attempting to delete Dev database"
          npx wrangler d1 delete ${{ env.DEV_COMM_HUB_D1_DB_NAME }} -y || true

      - name: Create New Dev D1 Instance (Dev Only)
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 create ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --env dev

      - name: Get New D1 ID and Set Environment Variable
        # Uses the database name to fetch the real ID
        run: |
          DB_ID=$(npx wrangler d1 info ${{ env.DEV_COMM_HUB_D1_DB_NAME }} --json | jq -r '.uuid')

          echo "DEV_COMM_HUB_D1_DB_ID=$DB_ID" >> $GITHUB_ENV

      - name: Apply D1 Migrations to Target D1 Database
        if: ${{ env.TARGET_ENV == 'dev' }}
        run: npx wrangler d1 migrations apply Database --env dev --remote
